[project]
name = "eda-webapp"
version = "0.1.0"
description = "GPU-accelerated, local-only exploratory data analysis web app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = [
    "cudf-cu12",
    "cuml-cu12",
    "cugraph-cu12",
]

# GPU packages are published on the NVIDIA index and are optional; install with:
#   uv pip install --extra-index-url=https://pypi.nvidia.com -e ".[gpu]"
